<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonchild Shop</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff9fc;
  color:#4d4050;
}

button,input{
  font:inherit;
}

.header{
  background:white;
  padding:18px 18px 10px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid #f3dce8;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-circle{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#f7b6d2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.logo h1{
  margin:0;
  font-size:21px;
  color:#b94f7e;
}

.logo small{
  color:#9b7b8c;
}

.icon-btn{
  border:0;
  background:#fff0f7;
  color:#d45291;
  width:43px;
  height:43px;
  border-radius:50%;
  font-size:21px;
}

.hero{
  margin:14px 14px 0;
  height:190px;
  border-radius:24px;
  background:
    linear-gradient(135deg,#f9d6e7,#fff4fa);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.hero-content h2{
  color:#b83f75;
  font-size:30px;
  margin:0 0 8px;
}

.hero-content p{
  margin:0;
  color:#806777;
}

.search{
  margin:15px;
  position:relative;
}

.search input{
  width:100%;
  border:1px solid #ead7e1;
  border-radius:30px;
  padding:15px 20px 15px 48px;
  background:white;
  outline:none;
  font-size:16px;
}

.search span{
  position:absolute;
  left:18px;
  top:13px;
  font-size:20px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 15px 16px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  border:0;
  background:white;
  color:#93677d;
  padding:11px 19px;
  border-radius:25px;
  white-space:nowrap;
}

.cat.active{
  background:#e84f99;
  color:white;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 16px 12px;
}

.section-title h2{
  margin:0;
  color:#583f4d;
  font-size:21px;
}

.section-title span{
  color:#c55789;
  font-size:14px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:0 14px 100px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(180,100,140,.08);
  position:relative;
}

.product-img{
  height:190px;
  background:#fff4f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
}

.discount{
  position:absolute;
  top:10px;
  right:8px;
  background:#ff4d55;
  color:white;
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
}

.product-info{
  padding:12px;
}

.product-name{
  font-size:15px;
  line-height:1.35;
  min-height:42px;
  color:#5d5260;
}

.price{
  margin-top:7px;
  display:flex;
  gap:7px;
  align-items:center;
}

.now{
  color:#171217;
  font-size:19px;
  font-weight:700;
}

.old{
  color:#aaa;
  text-decoration:line-through;
  font-size:14px;
}

.add{
  width:100%;
  margin-top:10px;
  border:0;
  background:#f5a5c8;
  color:white;
  padding:10px;
  border-radius:12px;
  font-weight:700;
}

.bottom{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:88%;
  max-width:430px;
  background:white;
  border-radius:30px;
  padding:10px;
  box-shadow:0 8px 30px rgba(120,70,100,.18);
  display:flex;
  justify-content:space-around;
  z-index:30;
}

.bottom button{
  border:0;
  background:transparent;
  color:#df4c91;
  font-size:24px;
  padding:7px 20px;
}

.cart-count{
  position:absolute;
  background:#e84f99;
  color:white;
  font-size:11px;
  border-radius:20px;
  padding:3px 7px;
  margin-left:-10px;
  margin-top:-4px;
}

.empty{
  text-align:center;
  padding:40px;
  color:#a78b99;
  grid-column:1/3;
}
</style>
</head>

<body>

<header class="header">
  <div class="top">

    <div class="logo">
      <div class="logo-circle">🌙</div>
      <div>
        <h1>Moonchild Shop</h1>
        <small>Beauty · Accessories · Cute Things</small>
      </div>
    </div>

    <button class="icon-btn" onclick="contact()">♡</button>

  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <div style="font-size:55px">🎀</div>
    <h2>Moonchild Shop</h2>
    <p>Pretty things selected with love ♡</p>
  </div>
</section>

<div class="search">
  <span>⌕</span>
  <input
    id="search"
    type="text"
    placeholder="Search products..."
    oninput="searchProducts()"
  >
</div>

<div class="categories">
  <button class="cat active" onclick="filterCategory('All',this)">All</button>
  <button class="cat" onclick="filterCategory('Cosmetics',this)">💄 Cosmetics</button>
  <button class="cat" onclick="filterCategory('Accessories',this)">🎀 Accessories</button>
  <button class="cat" onclick="filterCategory('Cute',this)">🧸 Cute Items</button>
</div>

<div class="section-title">
  <h2>New & Pretty ♡</h2>
  <span id="count">Products</span>
</div>

<div class="products" id="products"></div>

<div class="bottom">
  <button onclick="goHome()">⌂</button>

  <button onclick="showCart()">
    🛒
    <span class="cart-count" id="cartCount">0</span>
  </button>

  <button onclick="contact()">♡</button>
</div>

<script>

const products = [

{
 name:"Mirror Knight Unicorn Pink",
 price:10.80,
 old:12.00,
 category:"Accessories",
 emoji:"🦄",
 discount:"10% OFF"
},

{
 name:"Mirror Sweetie Bear Pink",
 price:10.80,
 old:12.00,
 category:"Accessories",
 emoji:"🧸",
 discount:"10% OFF"
},

{
 name:"Mirror Strawberry Cupid Pink",
 price:22.50,
 old:25.00,
 category:"Accessories",
 emoji:"🎀",
 discount:"10% OFF"
},

{
 name:"Knight Unicorn Small Set & Shoulder Bag",
 price:53.10,
 old:59.00,
 category:"Cute",
 emoji:"👜",
 discount:"10% OFF"
},

{
 name:"Pink Dream Eyeshadow",
 price:14.40,
 old:16.00,
 category:"Cosmetics",
 emoji:"🎨",
 discount:"10% OFF"
},

{
 name:"Pink Pearl Highlighter",
 price:8.10,
 old:9.00,
 category:"Cosmetics",
 emoji:"✨",
 discount:"10% OFF"
},

{
 name:"Cute Bow Hair Accessory",
 price:6.50,
 old:8.00,
 category:"Accessories",
 emoji:"🎀",
 discount:"10% OFF"
},

{
 name:"Sweet Pink Makeup Set",
 price:18.90,
 old:22.00,
 category:"Cosmetics",
 emoji:"💄",
 discount:"10% OFF"
}

];

let currentCategory="All";
let cart=[];

function render(list=products){

 const box=document.getElementById("products");

 if(list.length===0){
   box.innerHTML='<div class="empty">No products found ♡</div>';
   return;
 }

 box.innerHTML=list.map((p,i)=>`

   <div class="product">

     <div class="product-img">
       ${p.emoji}
     </div>

     <div class="discount">${p.discount}</div>

     <div class="product-info">

       <div class="product-name">
         ${p.name}
       </div>

       <div class="price">
         <span class="now">$${p.price.toFixed(2)}</span>
         <span class="old">$${p.old.toFixed(2)}</span>
       </div>

       <button class="add" onclick="addToCart(${i})">
         Add to cart ♡
       </button>

     </div>

   </div>

 `).join("");

 document.getElementById("count").innerText=list.length+" products";
}

function addToCart(i){

 cart.push(products[i]);

 document.getElementById("cartCount").innerText=cart.length;

 alert(products[i].name+" added to cart ♡");

}

function searchProducts(){

 const q=document.getElementById("search").value.toLowerCase();

 const list=products.filter(p=>
   (currentCategory==="All" || p.category===currentCategory)
   &&
   p.name.toLowerCase().includes(q)
 );

 render(list);

}

function filterCategory(cat,btn){

 currentCategory=cat;

 document.querySelectorAll(".cat").forEach(x=>{
   x.classList.remove("active");
 });

 btn.classList.add("active");

 searchProducts();

}

function showCart(){

 if(cart.length===0){
   alert("Your cart is empty ♡");
   return;
 }

 let message="Moonchild Shop Order%0A%0A";

 cart.forEach((p,i)=>{
   message+=(i+1)+". "+p.name+" - $"+p.price.toFixed(2)+"%0A";
 });

 const total=cart.reduce((sum,p)=>sum+p.price,0);

 message+="%0ATotal: $"+total.toFixed(2);

 window.open(
   "https://t.me/Moonchild5929?text="+message,
   "_blank"
 );

}

function contact(){

 window.open(
   "https://t.me/Moonchild5929",
   "_blank"
 );

}

function goHome(){

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });

}

if(window.Telegram && Telegram.WebApp){

 Telegram.WebApp.ready();
 Telegram.WebApp.expand();

}

render();

</script>

</body>
</html>
