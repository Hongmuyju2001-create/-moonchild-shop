<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonchild Shop Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff7fc;
  color:#5d4654;
}

.header{
  background:#d66b98;
  color:white;
  padding:25px 20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:7px 0 0;
  opacity:.9;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border:1px solid #f0d5e2;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #e8c9d633;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #e5c8d7;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus,select:focus{
  border-color:#d66b98;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:18px;
  background:#d66b98;
  color:white;
  font-size:17px;
  font-weight:700;
}

button:active{
  transform:scale(.98);
}

.preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  border-radius:15px;
  background:#fafafa;
  margin-top:12px;
  display:none;
}

.product{
  display:flex;
  gap:15px;
  align-items:center;
  border-top:1px solid #f1dce6;
  padding:15px 0;
}

.product img{
  width:85px;
  height:85px;
  object-fit:contain;
  border-radius:12px;
  background:#fafafa;
}

.product-info{
  flex:1;
}

.product-name{
  font-weight:700;
  font-size:16px;
}

.price{
  color:#c45783;
  font-weight:700;
  margin-top:5px;
}

.delete{
  width:auto;
  padding:9px 12px;
  margin:0;
  background:#ef6262;
  font-size:13px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#9b7f8d;
}
</style>
</head>

<body>

<div class="header">
  <h1>🌙 Moonchild Shop ♡</h1>
  <p>Admin Product Manager</p>
</div>

<div class="container">

  <div class="card">
    <h2>➕ Add Product</h2>

    <label>Product Image</label>
    <input type="file" id="image" accept="image/*">
    <img id="preview" class="preview">

    <label>Product Name</label>
    <input id="name" type="text" placeholder="Example: Flower Knows Lip Gloss">

    <label>Selling Price ($)</label>
    <input id="price" type="number" step="0.01" placeholder="12.50">

    <label>Old Price ($)</label>
    <input id="oldPrice" type="number" step="0.01" placeholder="15.00">

    <label>Category</label>
    <select id="category">
      <option>Cosmetics</option>
      <option>Accessories</option>
      <option>Bracelets</option>
      <option>Bags</option>
      <option>Cute Items</option>
      <option>Other</option>
    </select>

    <button onclick="addProduct()">💗 Add Product</button>
  </div>

  <div class="card">
    <h2>🛍️ My Products</h2>
    <div id="products"></div>
  </div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("moonchildProducts") || "[]");

let imageData = "";

document.getElementById("image").addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    imageData = event.target.result;

    const preview = document.getElementById("preview");

    preview.src = imageData;
    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});

function addProduct(){

  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value;
  const oldPrice = document.getElementById("oldPrice").value;
  const category = document.getElementById("category").value;

  if(!name || !price || !imageData){

    alert("Please add product image, name and price 💗");
    return;

  }

  const product = {

    id:Date.now(),
    name:name,
    price:price,
    oldPrice:oldPrice,
    category:category,
    image:imageData

  };

  products.push(product);

  localStorage.setItem(
    "moonchildProducts",
    JSON.stringify(products)
  );

  alert("Product added successfully 💗");

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("oldPrice").value="";
  document.getElementById("image").value="";

  imageData="";

  document.getElementById("preview").style.display="none";

  showProducts();

}

function deleteProduct(id){

  if(!confirm("Delete this product?")) return;

  products = products.filter(p => p.id !== id);

  localStorage.setItem(
    "moonchildProducts",
    JSON.stringify(products)
  );

  showProducts();

}

function showProducts(){

  const box = document.getElementById("products");

  if(products.length === 0){

    box.innerHTML =
      '<div class="empty">No products yet 🌸</div>';

    return;

  }

  box.innerHTML = products.map(p => `

    <div class="product">

      <img src="${p.image}">

      <div class="product-info">

        <div class="product-name">
          ${p.name}
        </div>

        <div class="price">
          $${p.price}
          ${
            p.oldPrice
            ? `<del style="color:#aaa;font-weight:400;margin-left:5px">
                 $${p.oldPrice}
               </del>`
            : ""
          }
        </div>

        <small>${p.category}</small>

      </div>

      <button
        class="delete"
        onclick="deleteProduct(${p.id})">
        Delete
      </button>

    </div>

  `).join("");

}

showProducts();

</script>

</body>
</html>
