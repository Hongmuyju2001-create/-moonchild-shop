<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonchild Shop Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff7fc;
  color:#4d4050;
}

.header{
  background:linear-gradient(135deg,#ff8fc8,#c9a7ff);
  color:white;
  padding:28px 20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:7px 0 0;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(150,100,150,.12);
}

h2{
  margin-top:0;
  color:#d64d98;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:600;
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #eadbea;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:80px;
  resize:vertical;
}

input:focus,textarea:focus{
  border-color:#e95ca8;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.add{
  background:#ec5aa7;
  color:white;
}

.clear{
  background:#f3e8f0;
  color:#80566f;
}

.product{
  display:flex;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid #f0e5ed;
}

.product:last-child{
  border-bottom:0;
}

.product img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:14px;
  background:#f7edf5;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:3px 0;
  font-size:16px;
}

.price{
  color:#e64d9c;
  font-weight:700;
}

.delete{
  width:auto;
  padding:8px 12px;
  margin:5px 0 0;
  background:#ffe4ef;
  color:#d33d82;
  font-size:13px;
}

.preview{
  margin-top:15px;
  width:100%;
  max-height:250px;
  object-fit:contain;
  border-radius:15px;
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>🌙 Moonchild Shop</h1>
  <p>Product Admin</p>
</div>

<div class="container">

  <div class="card">
    <h2>➕ Add Product</h2>

    <label>Product Name</label>
    <input id="name" type="text" placeholder="ឧ. Flower Knows Mirror">

    <label>Price ($)</label>
    <input id="price" type="number" step="0.01" placeholder="10.80">

    <label>Old Price ($) — optional</label>
    <input id="oldPrice" type="number" step="0.01" placeholder="12.00">

    <label>Description</label>
    <textarea id="description" placeholder="Product description..."></textarea>

    <label>Product Image</label>
    <input id="image" type="file" accept="image/*">

    <img id="preview" class="preview">

    <button class="add" onclick="addProduct()">
      Add Product 💗
    </button>

    <button class="clear" onclick="clearProducts()">
      Clear All Products
    </button>
  </div>

  <div class="card">
    <h2>🛍️ My Products</h2>
    <div id="products"></div>
  </div>

</div>

<script>

let products = JSON.parse(
  localStorage.getItem("moonchild_products") || "[]"
);

const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");

imageInput.addEventListener("change",function(){

  const file = this.files[0];

  if(!file){
    preview.style.display="none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    preview.src=e.target.result;
    preview.style.display="block";
  };

  reader.readAsDataURL(file);
});


function addProduct(){

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const oldPrice =
    document.getElementById("oldPrice").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const file =
    document.getElementById("image").files[0];

  if(!name || !price || !file){

    alert("Please add product name, price and image.");

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const product = {

      id:Date.now(),

      name:name,

      price:price,

      oldPrice:oldPrice,

      description:description,

      image:e.target.result

    };

    products.push(product);

    localStorage.setItem(
      "moonchild_products",
      JSON.stringify(products)
    );

    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("oldPrice").value="";
    document.getElementById("description").value="";
    document.getElementById("image").value="";

    preview.style.display="none";

    renderProducts();

    alert("Product added successfully 💗");

  };

  reader.readAsDataURL(file);

}


function deleteProduct(id){

  products =
    products.filter(product => product.id !== id);

  localStorage.setItem(
    "moonchild_products",
    JSON.stringify(products)
  );

  renderProducts();

}


function clearProducts(){

  if(!confirm("Delete all products?")) return;

  products=[];

  localStorage.removeItem("moonchild_products");

  renderProducts();

}


function renderProducts(){

  const box =
    document.getElementById("products");

  if(products.length===0){

    box.innerHTML=
      "<p style='text-align:center;color:#999'>No products yet 💗</p>";

    return;
  }

  box.innerHTML="";

  products.forEach(product=>{

    const div=document.createElement("div");

    div.className="product";

    div.innerHTML=`

      <img src="${product.image}">

      <div class="product-info">

        <h3>${product.name}</h3>

        <div class="price">$${product.price}</div>

        ${
          product.oldPrice
          ? `<div style="text-decoration:line-through;color:#aaa">
               $${product.oldPrice}
             </div>`
          : ""
        }

        <div style="font-size:13px;color:#888">
          ${product.description || ""}
        </div>

        <button
          class="delete"
          onclick="deleteProduct(${product.id})">
          Delete
        </button>

      </div>

    `;

    box.appendChild(div);

  });

}


renderProducts();

</script>

</body>
</html>
